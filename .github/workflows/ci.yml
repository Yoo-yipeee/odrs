name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: CLI smoke — every example validates via the CLI
        shell: bash
        run: |
          set -e
          for f in spec/v0.1/examples/*.{yaml,json} spec/v0.2/examples/*.yaml spec/v0.2/examples/exchange/*.yaml; do
            [ -e "$f" ] || continue
            node bin/odrs.mjs validate "$f" > /dev/null
          done
          node bin/odrs.mjs render spec/v0.2/examples/exchange/2-offer.yaml > /dev/null
          node bin/odrs.mjs version
